# Third-party files are kept byte for byte as released.
exclude: ^python_package/src/heams/results_browser/static/vendor/

repos:

# --- General hooks ---
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-merge-conflict
    -   id: check-yaml
    -   id: check-toml
    -   id: check-json
    -   id: check-added-large-files
        args: [--maxkb=1500]

# Jupyter Notebook cleaning
-   repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
    -   id: nbstripout

# Spell checking
-   repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
    -   id: codespell
        args: ['--config', '.codespellrc'] # See .codespellrc for configuration

# Security (Secrets detection)
-   repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
    -   id: gitleaks

# --- python_package hooks ---
# Code formatting and linting
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
    -   id: ruff
        args: [--fix]
        files: ^python_package/
    -   id: ruff-format
        files: ^python_package/

# Scoped type checking for orchestration + scenarios (FCIS path)
-   repo: local
    hooks:
    -   id: ty
        name: ty (orchestration + scenarios)
        entry: uv run --directory python_package ty check src/heams/orchestration src/heams/scenarios
        language: system
        files: ^python_package/src/heams/(orchestration|scenarios)/
        pass_filenames: false
