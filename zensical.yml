# Zensical site configuration — https://zensical.org/docs/
site_name: HEAMS
site_description: Extensible benchmarking for agentic private memory
site_url: https://milatechtransfer.github.io/heams/
repo_url: https://github.com/milatechtransfer/heams
copyright: "HEAMS: Holistic Evaluation of Agent Memory Systems"

docs_dir: python_package/docs
site_dir: site

theme:
  variant: modern
  palette:
    - scheme: default
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: lucide/moon
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/memory
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.path
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - CLI: cli.md
  - CLI reference: cli-reference.md
  - Memory backends: memory-backends.md
  - Adding a memory system: adding-memory-system.md
  - Understanding results: results.md
  - Results browser: results-browser.md
  - Cluster (Slurm): cluster.md
  - Benchmarks:
      - LoCoMo: benchmarks/locomo.md
      - BEAM: benchmarks/beam.md
      - MPBench: benchmarks/mpbench.md
      - Evo-Memory (single-turn): benchmarks/evomemory_single_turn.md
      - LongMemEval: benchmarks/long_mem_eval.md
      - Transparency: benchmarks/transparency.md
      - Contextual Integrity: benchmarks/contextual_integrity.md
      - STALE: benchmarks/stale.md
      - Erasability & Editability: benchmarks/erasability_editability.md
      - Retention policy: benchmarks/retention_policy.md
  - Contributing:
      - Adding a benchmark: adding-benchmark.md
  - Citations & credits: citations.md
