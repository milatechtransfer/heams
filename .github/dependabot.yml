# Dependabot security updates are enabled in the repository settings.
# This file groups them into a single PR across every lockfile listed below
# instead of one PR per package, so shared fixes land together and are tested
# once. A directory with a uv.lock that is missing here gets ungrouped PRs, so
# add new memory plugins to the list.
#
# open-pull-requests-limit: 0 turns off routine version updates, so PRs are
# only opened for security advisories.
version: 2
updates:
  - package-ecosystem: "uv"
    directories:
      - "/python_package"
      - "/memory_plugins/heams_memory_letta"
      - "/memory_plugins/heams_memory_mem0"
      - "/memory_plugins/heams_memory_milamem"
      - "/memory_plugins/heams_memory_privacy_wrapper"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
