# Dependabot security updates are enabled in the repository settings.
# This file groups them into one PR per lockfile instead of one PR per
# package, since every bump edits the same uv.lock and they conflict.
#
# open-pull-requests-limit: 0 turns off routine version updates, so PRs are
# only opened for security advisories.
version: 2
updates:
  - package-ecosystem: "uv"
    directories:
      - "/python_package"
      - "/memory_plugins/heams_memory_letta"
      - "/memory_plugins/heams_memory_mem0"
      - "/memory_plugins/heams_memory_milamem"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
