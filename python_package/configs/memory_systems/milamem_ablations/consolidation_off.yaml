# C1-off: Part A recall, no retain-time dedup, no batch consolidation.
id: milamem_consolidation_off
backend_config:
  type: milamem
  name: milamem_consolidation_off
  top_k: 10
  temporal_metadata:
    enabled: true
  recall_strategy:
    kind: hybrid
    embed_model: openai:text-embedding-3-small
    hybrid_weight: 0.5
    fusion: absolute
    filter_ratio: 0.5
  dedup_strategy:
    enabled: false
  consolidation:
    enabled: false
