# R2a: absolute fusion + relative filter, OpenAI text-embedding-3-small.
id: milamem_r2a_absolute_3small
backend_config:
  type: milamem
  name: milamem_r2a_absolute_3small
  top_k: 20
  temporal_metadata:
    enabled: true
  recall_strategy:
    kind: hybrid
    embed_model: openai:text-embedding-3-small
    hybrid_weight: 0.5
    fusion: absolute
    filter_ratio: 0.5
  dedup_strategy:
    enabled: false
  consolidation:
    enabled: false
