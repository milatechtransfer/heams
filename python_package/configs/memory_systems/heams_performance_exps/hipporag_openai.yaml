id: hipporag_openai_k10
backend_config:
  type: hipporag
  name: hipporag_openai_k10
  top_k: 10
  # Passed verbatim to HippoRAG's BaseConfig; unset fields keep HippoRAG's defaults.
  global_config:
    llm_name: gpt-4o-mini
    embedding_model_name: text-embedding-3-small
    openie_mode: online
    temperature: 0.0
    # Reduce malformed extraction responses on passages containing code or math.
    response_format:
      type: json_object
