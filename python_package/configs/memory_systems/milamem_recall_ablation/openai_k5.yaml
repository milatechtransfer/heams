# Hybrid recall, absolute fusion + relative filter, OpenAI text-embedding-3-small.
id: milamem_recall_openai_k5
backend_config:
  type: milamem
  name: milamem_recall_openai_k5
  top_k: 5
  temporal_metadata:
    enabled: true
  recall_strategy:
    kind: hybrid
    embed_model: openai:text-embedding-3-small
    hybrid_weight: 0.5
    fusion: absolute
    filter_ratio: 0.5
  dedup_strategy:
    enabled: false
  consolidation:
    enabled: false
