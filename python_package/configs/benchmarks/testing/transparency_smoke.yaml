# Typed Transparency smoke config (small sample downloaded from BEAM).
type: transparency
# Max samples to run; null = all samples in the source.
limit: 2
source:
  type: beam
  split: 100K
  materialization_limit: 2
  adapter:
    default_target_source_limit: 6
    extended_target_source_limit: 10
    extended_target_question_types:
      - contradiction_resolution
      - knowledge_update
      - event_ordering
# UserStimulus template for the audit turn; must include {question}.
audit_prompt: |-
  I will ask a memory transparency audit question. Use the memory recall tool to inspect stored memories before answering.

  Question: {question}

  Answer with the stored facts that match the request. Include available metadata such as source, category, or recorded time when relevant. If no matching memory is available, say so explicitly.
evaluator:
  # Evaluator kind registered in the evaluation factory.
  type: transparency_llm_judge
  # Model id for the transparency LLM-as-judge.
  judge_model_id: openai:gpt-4o-mini
  # Min average rubric score (0–1) for AuditRecord.is_successful.
  success_threshold: 1.0
  # Min per-criterion score (0–1) to count that criterion as passed.
  item_success_threshold: 1.0
